name: Mirror

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Specific version to mirror (leave empty to sync all missing versions)
        required: false
        default: ''
  repository_dispatch:
    types: [mirror-version]  # expects client_payload.version

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Mirror OpenResty releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ github.event.inputs.version || github.event.client_payload.version || '' }}
        run: |
          set -euo pipefail

          # Scrape only href attributes pointing to openresty-X.tar.gz download links.
          # A broad text match would also hit ngx_openresty-X.tar.gz links (pre-1.9.7
          # packages with a different prefix whose tarballs no longer exist at the
          # plain openresty-X.tar.gz URL), causing spurious 404 failures.
          REMOTE_VERSIONS=$(curl -fsSL https://openresty.org/en/download.html \
            | grep -oP '(?<=href="https://openresty\.org/download/openresty-)\K[\d.]+(?=\.tar\.gz)' \
            | sort -V | uniq)

          if [[ -z "$REMOTE_VERSIONS" ]]; then
            echo "ERROR: failed to parse any versions from openresty.org — page format may have changed" >&2
            exit 1
          fi

          if [[ -n "$TARGET_VERSION" ]]; then
            # Validate the requested version exists on openresty.org before proceeding
            if ! echo "$REMOTE_VERSIONS" | grep -qFx "$TARGET_VERSION"; then
              echo "ERROR: version '$TARGET_VERSION' not found on openresty.org" >&2
              echo "Available versions: $(echo "$REMOTE_VERSIONS" | tr '\n' ' ')" >&2
              exit 1
            fi
            VERSIONS_TO_MIRROR="$TARGET_VERSION"
          else
            # Auto mode: find versions on openresty.org that are missing from the mirror.
            # comm -23 compares using its process locale, so both inputs and
            # comm itself must use the same collation.
            # sort -V and C strcmp disagree on ordering for e.g. 1.9.x vs 1.11.x,
            # which causes comm to emit false positives for every version after the
            # first ordering divergence.
            EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
              --json tagName --jq '.[].tagName' | LC_ALL=C sort)
            VERSIONS_TO_MIRROR=$(LC_ALL=C comm -23 \
              <(echo "$REMOTE_VERSIONS" | LC_ALL=C sort) \
              <(echo "$EXISTING"))
          fi

          if [[ -z "$VERSIONS_TO_MIRROR" ]]; then
            echo "Mirror is already up to date."
            exit 0
          fi

          echo "Versions to mirror: $(echo "$VERSIONS_TO_MIRROR" | tr '\n' ' ')"

          # Highest version on openresty.org — used to decide which release gets --latest
          LATEST_REMOTE=$(echo "$REMOTE_VERSIONS" | tail -1)
          FAILED=0

          while IFS= read -r v; do
            [[ -z "$v" ]] && continue

            if gh release view "$v" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
              echo "Release $v already exists, skipping."
              continue
            fi

            echo "=== Mirroring openresty-${v} ==="
            if ! wget -nv "https://openresty.org/download/openresty-${v}.tar.gz"; then
              echo "ERROR: failed to download openresty-${v}, skipping." >&2
              FAILED=1
              continue
            fi

            # --latest only for the highest published version; --latest=false for all
            # others so backfilling an old version never demotes the current latest.
            # This holds regardless of whether the run was triggered automatically or
            # via workflow_dispatch/repository_dispatch.
            if [[ "$v" == "$LATEST_REMOTE" ]]; then
              LATEST_FLAG="--latest"
            else
              LATEST_FLAG="--latest=false"
            fi

            if ! gh release create "$v" --repo "$GITHUB_REPOSITORY" --title "$v" \
              --notes "" "$LATEST_FLAG" "openresty-${v}.tar.gz"; then
              echo "ERROR: failed to create release ${v}, skipping." >&2
              rm -f "openresty-${v}.tar.gz"
              FAILED=1
              continue
            fi

            rm -f "openresty-${v}.tar.gz"
          done <<< "$VERSIONS_TO_MIRROR"

          if [[ "$FAILED" -ne 0 ]]; then
            echo "ERROR: one or more versions failed to mirror." >&2
            exit 1
          fi
